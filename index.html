<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="preloader">
        <div class="preloader-content">
            <div class="preloader-spinner"></div>
            <p>Loading Heroes...</p>
        </div>
    </div>

    <div class="character-selection">
        <h1 class="title">Choose Your Hero</h1>
        
        <div class="characters-grid-container">
            <div class="characters-grid">
                <div class="character-slot" data-player="1" data-color="blue" data-character-index="0">
                    <div class="character-frame">
                        <div class="select-character-text">Player 1</div>
                        <div class="character-image-wrapper">
                            <img src="/character1.png" alt="Warrior" class="character-image" data-base-hue="240">
                        </div>
                        <div class="character-stats">
                            <div class="gender-toggle-container" style="visibility: hidden;">
                                <button class="gender-toggle active" data-gender="male">M</button>
                                <button class="gender-toggle" data-gender="female">F</button>
                            </div>
                            <div class="character-name-container">
                                <button class="arrow left-arrow">◀</button>
                                <span class="stat-label"><span class="character-name-text">Warrior</span></span>
                                <button class="arrow right-arrow">▶</button>
                            </div>
                            <div class="stat-line strength">Strength: 9</div>
                            <div class="stat-line speed">Speed: 5</div>
                            <div class="stat-line magic">Magic: 2</div>
                            <div class="stat-line armour">Armour: 8</div>
                        </div>
                    </div>
                </div>
                
                <div class="character-slot empty-slot" data-player="2" data-color="green">
                    <div class="character-frame">
                        <div class="character-image-wrapper">
                            <img src="/skull.png" alt="Empty Slot" class="character-image empty-skull">
                        </div>
                        <div class="empty-slot-text">Waiting for Player...</div>
                    </div>
                </div>
                
                <div class="character-slot empty-slot" data-player="3" data-color="yellow">
                     <div class="character-frame">
                        <div class="character-image-wrapper">
                            <img src="/skull.png" alt="Empty Slot" class="character-image empty-skull">
                        </div>
                        <div class="empty-slot-text">Waiting for Player...</div>
                    </div>
                </div>
                
                <div class="character-slot empty-slot" data-player="4" data-color="red">
                     <div class="character-frame">
                        <div class="character-image-wrapper">
                            <img src="/skull.png" alt="Empty Slot" class="character-image empty-skull">
                        </div>
                        <div class="empty-slot-text">Waiting for Player...</div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    
    <div id="start-overlay">
        <div class="start-content">
            <h2 class="start-title">Ancient Champions</h2>
            <div class="start-buttons">
                <button id="host-game-btn" class="start-btn">Host Game</button>
                <button id="scan-to-join-btn" class="start-btn">Scan to Join</button>
                <button id="realtime-mode-btn" class="start-btn" disabled>Realtime Mode</button>
            </div>
        </div>
    </div>

    <div id="qr-code-container" class="hidden">
        <div id="qr-code"></div>
        <p>Scan to Join!</p>
    </div>

    <div id="qr-scanner-container" class="hidden">
        <div id="qr-reader"></div>
        <button id="close-scanner-btn">Cancel</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "peerjs": "https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.esm.min.js"
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script src="audio.js"></script>
    <script type="module" src="network.js"></script>
    <script src="characters.js"></script>
    <script src="color-shader.js"></script>
    <script src="ui.js"></script>
    <script src="cursor.js"></script>
    <script src="mobile.js"></script>
    <script src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
